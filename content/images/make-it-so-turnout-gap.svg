    <circle class="muni-dot" cx="460.2" cy="249.4" r="4"><title>Chicago municipal, February 2007: 33.08%</title></circle>
    <circle class="muni-dot" cx="528.0" cy="213.5" r="4"><title>Chicago municipal, February 2011: 42.30%</title></circle>
    <circle class="muni-dot" cx="595.7" cy="245.7" r="4"><title>Chicago municipal, February 2015: 34.03%</title></circle>
    <circle class="muni-dot" cx="663.4" cy="240.1" r="4"><title>Chicago municipal, February 2019: 35.45%</title></circle>
    <circle class="muni-dot" cx="731.1" cy="238.6" r="4"><title>Chicago municipal, February 2023: 35.85%</title></circle>
  <text class="label-pres" x="760.0" y="111.8">Presidential</text>
  <text class="tick" x="760.0" y="127.8">67.94% in 2024</text>
  <text class="label-muni" x="743.1" y="240.6">Municipal</text>
  <text class="tick" x="743.1" y="256.6">35.85% in 2023</text>
  <text class="tick" x="54.0" y="46.8">82.07% — April 1983</text>
