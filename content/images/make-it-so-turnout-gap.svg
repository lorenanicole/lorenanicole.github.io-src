<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430"
     role="img" width="100%" style="max-width:880px;height:auto"
     aria-label="Line chart of Chicago voter turnout from 1983 to 2024. Turnout in
     presidential general elections stays between 63 and 78 percent across the whole
     period, ending at 67.94 percent in November 2024. Turnout in Chicago municipal
     elections starts at 82.07 percent in April 1983, falls below 46 percent by 1991,
     and has sat between 33 and 42 percent ever since, ending at 35.85 percent in
     February 2023.">
<style>
  .viz { --ink: #16161d; --quiet: #5a5a52; --rule: #d7d7d0; --surface: #fcfcfb;
          --pres: #2a78d6; --muni: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .viz { --ink: #e8e8e3; --quiet: #a0a098; --rule: #3a3a42; --surface: #1a1a19;
            --pres: #3987e5; --muni: #d95926; }
  }
  .surface { fill: var(--surface); }
  .grid { stroke: var(--rule); stroke-width: 1; }
  .tick { fill: var(--quiet); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .pres-line { fill: none; stroke: var(--pres); stroke-width: 2; }
  .muni-line { fill: none; stroke: var(--muni); stroke-width: 2;
                stroke-dasharray: 7 4; }
  .pres-dot { fill: var(--pres); }
  .muni-dot { fill: var(--muni); }
  .label-pres { fill: var(--ink); font: 700 13px ui-sans-serif, system-ui, sans-serif; }
  .label-muni { fill: var(--ink); font: 700 13px ui-sans-serif, system-ui, sans-serif; }
</style>
<g class="viz">
  <rect class="surface" x="0" y="0" width="880" height="430" rx="6"/>
  <line class="grid" x1="54" y1="378.0" x2="748" y2="378.0"/>
  <text class="tick" x="44" y="382.0" text-anchor="end">0%</text>
  <line class="grid" x1="54" y1="300.2" x2="748" y2="300.2"/>
  <text class="tick" x="44" y="304.2" text-anchor="end">20%</text>
  <line class="grid" x1="54" y1="222.4" x2="748" y2="222.4"/>
  <text class="tick" x="44" y="226.4" text-anchor="end">40%</text>
  <line class="grid" x1="54" y1="144.7" x2="748" y2="144.7"/>
  <text class="tick" x="44" y="148.7" text-anchor="end">60%</text>
  <line class="grid" x1="54" y1="66.9" x2="748" y2="66.9"/>
  <text class="tick" x="44" y="70.9" text-anchor="end">80%</text>
  <text class="tick" x="54.0" y="400" text-anchor="middle">1983</text>
  <text class="tick" x="189.4" y="400" text-anchor="middle">1991</text>
  <text class="tick" x="324.8" y="400" text-anchor="middle">1999</text>
  <text class="tick" x="460.2" y="400" text-anchor="middle">2007</text>
  <text class="tick" x="595.7" y="400" text-anchor="middle">2015</text>
  <text class="tick" x="731.1" y="400" text-anchor="middle">2023</text>
  <path class="pres-line" d="M70.9,73.8 L138.6,99.6 L206.3,88.0 L274.0,132.3 L341.8,104.9 L409.5,85.8 L477.2,90.7 L544.9,84.7 L612.6,101.7 L680.3,93.0 L748.0,113.8"/>
    <circle class="pres-dot" cx="70.9" cy="73.8" r="4"><title>Presidential general, November 1984: 78.23%</title></circle>
    <circle class="pres-dot" cx="138.6" cy="99.6" r="4"><title>Presidential general, November 1988: 71.58%</title></circle>
