[tool.poetry]
name = "lorenamesa-com"
version = "2.0.0"
description = "Lorena Mesa - Technical leader, backend engineer, Python & AI advocate"
authors = ["Lorena Mesa <me@lorenamesa.com>"]
license = "CC0-1.0"
readme = "README.md"
homepage = "https://lorenamesa.com"
repository = "https://github.com/lorenanicole/lorenanicole.github.io-src"
keywords = ["blog", "pelican", "python", "ai", "backend"]
packages = []
classifiers = [
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
]

[tool.poetry.dependencies]
python = "^3.9"
pelican = "^4.9"
markdown = "^3.4"
python-dateutil = "^2.8"
pelican-tailwindcss = "^0.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
isort = "^5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
